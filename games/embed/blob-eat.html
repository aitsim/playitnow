<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Blob</title>
<style>
  :root {
    --bg: #0d0a1a;
    --grid: #1b1533;
    --ink: #f4eefd;
    --ink-dim: #9c8fc2;
    --gold: #f2b134;
    --coral: #ff6f59;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
    cursor: crosshair;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.7;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #hud .label { color: var(--ink-dim); }
  #hud .val { color: var(--gold); font-weight: 700; }

  #sound-toggle {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px; padding: 0;
    background: rgba(21, 15, 34, 0.6); border: 1px solid rgba(244,238,253,0.15);
    border-radius: 6px; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
  }
  #sound-toggle svg { width: 16px; height: 16px; display: block; }
  #sound-toggle .mute-x { opacity: 0; }
  #sound-toggle.muted .wave { opacity: 0; }
  #sound-toggle.muted .mute-x { opacity: 1; }

  #hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--ink-dim);
    font-size: 12px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    white-space: nowrap;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(13, 10, 26, 0.82);
    color: var(--ink);
    text-align: center;
    padding: 1.5rem;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    font-size: 1.6rem;
    margin: 0 0 0.3rem;
    color: var(--coral);
  }
  #overlay p {
    color: var(--ink-dim);
    margin: 0 0 1.4rem;
    font-size: 0.95rem;
  }
  #overlay button {
    font-size: 1rem;
    font-weight: 600;
    color: #1a1226;
    background: var(--gold);
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1.6rem;
    cursor: pointer;
  }
  #overlay button:hover { background: var(--coral); }

  #start-screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    text-align: center;
    padding: 1.5rem;
    z-index: 5;
  }
  #start-screen h1 {
    font-size: 1.7rem;
    margin: 0 0 0.4rem;
    background: linear-gradient(90deg, var(--gold), var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #start-screen p {
    color: var(--ink-dim);
    max-width: 380px;
    margin: 0 0 1.4rem;
    font-size: 0.92rem;
  }
  #start-screen button {
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a1226;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 0.85rem 2rem;
    cursor: pointer;
  }
  #start-screen button:hover { background: var(--coral); }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div><span class="label">Size</span> <span class="val" id="hud-size">120</span></div>
    <div><span class="label">Rank</span> <span class="val" id="hud-rank">-</span></div>
  </div>
  <div id="hint">Move your mouse / finger to steer &middot; eat smaller blobs, avoid bigger ones</div>

  <button id="sound-toggle" aria-label="Toggle sound" title="Toggle sound">
    <svg viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
      <path class="wave" d="M16 8a5 5 0 0 1 0 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path class="mute-x" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="overlay">
    <h2 id="overlay-title">Eaten!</h2>
    <p id="overlay-sub">A bigger blob got you.</p>
    <button id="retry-btn">Play Again</button>
  </div>

  <div id="start-screen">
    <h1>NEON BLOB</h1>
    <p>Move to absorb glowing pellets and smaller blobs to grow. Bigger blobs can eat you — steer clear until you've grown enough to turn the tables.</p>
    <button id="start-btn">Start</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('game-wrap');
  const hudSize = document.getElementById('hud-size');
  const hudRank = document.getElementById('hud-rank');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const retryBtn = document.getElementById('retry-btn');
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const soundToggle = document.getElementById('sound-toggle');

  // ---------- Audio (synthesized, no external files) ----------
  let audioCtx = null;
  let soundOn = true;
  try {
    soundOn = localStorage.getItem('neonblob_sound') !== 'off';
  } catch (e) { /* ignore */ }
  if (!soundOn) soundToggle.classList.add('muted');

  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }

  function tone(freq, duration, waveType, peakGain, delay) {
    if (!soundOn) return;
    const ac = getAudioCtx();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = waveType || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function sfxPellet() { tone(700, 0.05, 'sine', 0.08); }
  function sfxAbsorb(size) {
    const n = Math.min(Math.floor(size / 40), 8);
    tone(200 + n * 15, 0.18, 'sawtooth', 0.14);
    tone(400 + n * 20, 0.12, 'sine', 0.08, 0.05);
  }
  function sfxGameOver() {
    tone(320, 0.22, 'sawtooth', 0.14, 0);
    tone(240, 0.26, 'sawtooth', 0.14, 0.16);
    tone(160, 0.35, 'sawtooth', 0.14, 0.32);
  }

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.classList.toggle('muted', !soundOn);
    try { localStorage.setItem('neonblob_sound', soundOn ? 'on' : 'off'); } catch (e) { /* ignore */ }
    if (soundOn) {
      const ac = getAudioCtx();
      if (ac && ac.state === 'suspended') ac.resume();
    }
  });

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- World ----------
  const WORLD = { w: 3000, h: 2200 };
  const NUM_PELLETS = 220;
  const NUM_AI = 10;
  const START_MASS = 120;
  const PELLET_MASS = 5;
  const K_RADIUS = 2.2;
  const EAT_RATIO = 1.15;
  const GROWTH_KEEP = 0.7;

  let pellets = [];
  let blobs = [];
  let player = null;
  let camera = { x: 0, y: 0 };
  let mouse = { x: 0, y: 0 };
  let running = false;
  let lastTime = 0;
  let elapsed = 0;

  const PALETTE = [
    { body: '#f2b134', glow: 'rgba(242,177,52,0.5)' },
    { body: '#ff6f59', glow: 'rgba(255,111,89,0.5)' },
    { body: '#6ee7ff', glow: 'rgba(110,231,255,0.5)' },
    { body: '#9d7bff', glow: 'rgba(157,123,255,0.5)' },
    { body: '#7dffb3', glow: 'rgba(125,255,179,0.5)' },
    { body: '#ff9ecb', glow: 'rgba(255,158,203,0.5)' },
  ];

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function radiusOf(mass) { return Math.sqrt(mass) * K_RADIUS; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function makePellet() {
    return {
      x: rand(0, WORLD.w),
      y: rand(0, WORLD.h),
      r: rand(3, 5),
      color: PALETTE[Math.floor(rand(0, PALETTE.length))].body,
    };
  }

  function rollAiMass(difficulty) {
    const r = Math.random();
    if (r < 0.55) return rand(30, 80);
    if (r < 0.88) return rand(80, 200) * Math.min(1.3, difficulty);
    return rand(250, 480) * Math.min(1.4, difficulty);
  }

  function makeBlob(mass, colorIdx) {
    return {
      x: rand(WORLD.w * 0.1, WORLD.w * 0.9),
      y: rand(WORLD.h * 0.1, WORLD.h * 0.9),
      mass,
      color: PALETTE[colorIdx % PALETTE.length],
      wanderAngle: rand(0, Math.PI * 2),
      aiTimer: rand(0.5, 2),
      targetPellet: null,
    };
  }

  function resetWorld() {
    pellets = [];
    for (let i = 0; i < NUM_PELLETS; i++) pellets.push(makePellet());

    blobs = [];
    player = makeBlob(START_MASS, 0);
    player.isPlayer = true;
    blobs.push(player);
    for (let i = 0; i < NUM_AI; i++) {
      blobs.push(makeBlob(rollAiMass(1), i + 1));
    }
    camera.x = player.x;
    camera.y = player.y;
    elapsed = 0;
  }

  // ---------- Input ----------
  function updatePointer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = clientX - rect.left;
    mouse.y = clientY - rect.top;
  }
  canvas.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; updatePointer(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0]; updatePointer(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  function speedFor(mass) {
    const r = radiusOf(mass);
    return clamp(230 - r * 1.6, 65, 230);
  }

  function moveBlobToward(b, tx, ty, dt) {
    const dx = tx - b.x, dy = ty - b.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 2) return;
    const speed = speedFor(b.mass);
    const nx = dx / d, ny = dy / d;
    b.x += nx * speed * dt;
    b.y += ny * speed * dt;
    b.x = clamp(b.x, radiusOf(b.mass), WORLD.w - radiusOf(b.mass));
    b.y = clamp(b.y, radiusOf(b.mass), WORLD.h - radiusOf(b.mass));
  }

  function updatePlayer(dt) {
    const dx = mouse.x - W / 2;
    const dy = mouse.y - H / 2;
    const d = Math.sqrt(dx * dx + dy * dy);
    const deadzone = 8;
    if (d > deadzone) {
      moveBlobToward(player, player.x + dx, player.y + dy, dt);
    }
  }

  function nearestPellet(b) {
    let best = null, bestD = Infinity;
    for (const p of pellets) {
      const d = dist2(b.x, b.y, p.x, p.y);
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  function updateAI(b, dt) {
    b.aiTimer -= dt;
    if (b.aiTimer <= 0 || !b.targetPellet) {
      b.aiTimer = rand(1, 2.2);
      b.targetPellet = nearestPellet(b);
    }
    if (b.targetPellet) {
      moveBlobToward(b, b.targetPellet.x, b.targetPellet.y, dt);
    }
  }

  function eatPellets(b) {
    for (let i = pellets.length - 1; i >= 0; i--) {
      const p = pellets[i];
      if (dist2(b.x, b.y, p.x, p.y) < (radiusOf(b.mass) + p.r) * (radiusOf(b.mass) + p.r)) {
        pellets.splice(i, 1);
        b.mass += PELLET_MASS;
        pellets.push(makePellet());
        if (b.isPlayer) sfxPellet();
      }
    }
  }

  function checkPlayerPredation() {
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      if (b === player) continue;
      const d = Math.sqrt(dist2(player.x, player.y, b.x, b.y));
      const rp = radiusOf(player.mass), rb = radiusOf(b.mass);
      if (d > rp + rb) continue;

      if (player.mass > b.mass * EAT_RATIO && d < rp) {
        sfxAbsorb(b.mass);
        player.mass += b.mass * GROWTH_KEEP;
        const difficulty = 1 + elapsed / 60;
        blobs[i] = makeBlob(rollAiMass(difficulty), i);
      } else if (b.mass > player.mass * EAT_RATIO && d < rb) {
        endRun(b);
        return;
      }
    }
  }

  function computeRank() {
    const sorted = [...blobs].sort((a, b) => b.mass - a.mass);
    const idx = sorted.indexOf(player);
    return idx === -1 ? '-' : (idx + 1) + ' / ' + sorted.length;
  }

  // ---------- Render ----------
  const ZOOM = 0.4;

  function draw() {
    ctx.clearRect(0, 0, W, H);

    camera.x += (player.x - camera.x) * 0.15;
    camera.y += (player.y - camera.y) * 0.15;

    const halfW = (W / 2) / ZOOM;
    const halfH = (H / 2) / ZOOM;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-camera.x, -camera.y);

    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1 / ZOOM;
    const gridSize = 60;
    const startX = Math.floor((camera.x - halfW) / gridSize) * gridSize;
    const startY = Math.floor((camera.y - halfH) / gridSize) * gridSize;
    for (let x = startX; x < camera.x + halfW + gridSize; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, camera.y - halfH); ctx.lineTo(x, camera.y + halfH + gridSize); ctx.stroke();
    }
    for (let y = startY; y < camera.y + halfH + gridSize; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(camera.x - halfW, y); ctx.lineTo(camera.x + halfW + gridSize, y); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(242,177,52,0.25)';
    ctx.lineWidth = 3 / ZOOM;
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

    for (const p of pellets) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const sortedForDraw = [...blobs].sort((a, b) => a.mass - b.mass);
    for (const b of sortedForDraw) {
      const r = radiusOf(b.mass);
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = b.color.body;
      ctx.shadowColor = b.color.glow;
      ctx.shadowBlur = b.isPlayer ? 16 : 10;
      ctx.globalAlpha = 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      if (b.isPlayer) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#f4eefd';
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  // ---------- Loop ----------
  function loop(ts) {
    if (!running) return;
    const dt = Math.min((ts - lastTime) / 1000, 0.05) || 0;
    lastTime = ts;
    elapsed += dt;

    updatePlayer(dt);
    for (const b of blobs) if (!b.isPlayer) updateAI(b, dt);
    for (const b of blobs) eatPellets(b);
    checkPlayerPredation();

    if (!running) return;

    hudSize.textContent = Math.floor(player.mass);
    hudRank.textContent = computeRank();

    draw();

    if (running) requestAnimationFrame(loop);
  }

  function endRun(eater) {
    running = false;
    overlayTitle.textContent = 'Eaten!';
    overlaySub.textContent = 'A bigger blob got you. Final size: ' + Math.floor(player.mass);
    overlay.classList.add('show');
    sfxGameOver();
  }

  function startGame() {
    resize();
    resetWorld();
    overlay.classList.remove('show');
    startScreen.style.display = 'none';
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  resize();
})();
</script>
</body>
</html>
