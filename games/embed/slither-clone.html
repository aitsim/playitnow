<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Slither</title>
<style>
  :root {
    --bg: #0d0a1a;
    --grid: #1b1533;
    --ink: #f4eefd;
    --ink-dim: #9c8fc2;
    --gold: #f2b134;
    --coral: #ff6f59;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
    cursor: crosshair;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.7;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #hud .label { color: var(--ink-dim); }
  #hud .val { color: var(--gold); font-weight: 700; }

  #hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--ink-dim);
    font-size: 12px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    white-space: nowrap;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(13, 10, 26, 0.82);
    color: var(--ink);
    text-align: center;
    padding: 1.5rem;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    font-size: 1.6rem;
    margin: 0 0 0.3rem;
    color: var(--coral);
  }
  #overlay p {
    color: var(--ink-dim);
    margin: 0 0 1.4rem;
    font-size: 0.95rem;
  }
  #overlay button {
    font-size: 1rem;
    font-weight: 600;
    color: #1a1226;
    background: var(--gold);
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1.6rem;
    cursor: pointer;
  }
  #overlay button:hover { background: var(--coral); }

  #start-screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    text-align: center;
    padding: 1.5rem;
    z-index: 5;
  }
  #start-screen h1 {
    font-size: 1.7rem;
    margin: 0 0 0.4rem;
    background: linear-gradient(90deg, var(--gold), var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #start-screen p {
    color: var(--ink-dim);
    max-width: 380px;
    margin: 0 0 1.4rem;
    font-size: 0.92rem;
  }
  #start-screen button {
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a1226;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 0.85rem 2rem;
    cursor: pointer;
  }
  #start-screen button:hover { background: var(--coral); }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div><span class="label">Length</span> <span class="val" id="hud-length">10</span></div>
    <div><span class="label">Rank</span> <span class="val" id="hud-rank">-</span></div>
  </div>
  <div id="hint">Move your mouse / finger to steer &middot; don't hit other trails</div>

  <div id="overlay">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-sub">You collided with a rival.</p>
    <button id="retry-btn">Play Again</button>
  </div>

  <div id="start-screen">
    <h1>NEON SLITHER</h1>
    <p>Guide your snake, eat the glowing orbs to grow, and avoid crossing anyone's trail — including your own.</p>
    <button id="start-btn">Start</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('game-wrap');
  const hudLength = document.getElementById('hud-length');
  const hudRank = document.getElementById('hud-rank');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const retryBtn = document.getElementById('retry-btn');
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- World ----------
  const WORLD = { w: 2600, h: 2000 };
  const SEGMENT_SPACING = 9;
  const BASE_SPEED = 140;      // px/sec
  const BOOST_MULT = 1.7;
  const TURN_RATE = 4.2;       // radians/sec max turn
  const NUM_BOTS = 6;
  const NUM_ORBS = 140;
  const HEAD_RADIUS = 8;

  let orbs = [];
  let snakes = [];
  let player = null;
  let camera = { x: 0, y: 0 };
  let mouse = { x: 0, y: 0 };
  let running = false;
  let lastTime = 0;

  const PALETTE = [
    { body: '#f2b134', glow: 'rgba(242,177,52,0.5)' },
    { body: '#ff6f59', glow: 'rgba(255,111,89,0.5)' },
    { body: '#6ee7ff', glow: 'rgba(110,231,255,0.5)' },
    { body: '#9d7bff', glow: 'rgba(157,123,255,0.5)' },
    { body: '#7dffb3', glow: 'rgba(125,255,179,0.5)' },
    { body: '#ff9ecb', glow: 'rgba(255,158,203,0.5)' },
  ];

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function wrapCoord(v, max) { if (v < 0) return v + max; if (v >= max) return v - max; return v; }

  function makeOrb() {
    return {
      x: rand(0, WORLD.w),
      y: rand(0, WORLD.h),
      r: rand(3, 5.5),
      hue: PALETTE[Math.floor(rand(0, PALETTE.length))].body,
    };
  }

  function makeSnake(isPlayer, colorIdx) {
    const x = rand(WORLD.w * 0.2, WORLD.w * 0.8);
    const y = rand(WORLD.h * 0.2, WORLD.h * 0.8);
    const angle = rand(0, Math.PI * 2);
    const path = [];
    for (let i = 0; i < 300; i++) {
      path.push({ x: x - Math.cos(angle) * i * SEGMENT_SPACING, y: y - Math.sin(angle) * i * SEGMENT_SPACING });
    }
    return {
      isPlayer,
      alive: true,
      x, y, angle,
      targetAngle: angle,
      speed: BASE_SPEED,
      boosting: false,
      length: 10,
      path,
      color: PALETTE[colorIdx % PALETTE.length],
      aiTimer: 0,
      aiTargetOrb: null,
    };
  }

  function segmentsOf(snake) {
    const count = Math.max(6, Math.floor(snake.length));
    const segs = [];
    for (let i = 0; i < count; i++) {
      const idx = Math.min(i * 2, snake.path.length - 1);
      segs.push(snake.path[idx]);
    }
    return segs;
  }

  function resetWorld() {
    orbs = [];
    for (let i = 0; i < NUM_ORBS; i++) orbs.push(makeOrb());

    snakes = [];
    player = makeSnake(true, 0);
    snakes.push(player);
    for (let i = 0; i < NUM_BOTS; i++) {
      snakes.push(makeSnake(false, i + 1));
    }
    camera.x = player.x;
    camera.y = player.y;
  }

  // ---------- Input ----------
  function updatePointer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = clientX - rect.left;
    mouse.y = clientY - rect.top;
  }
  canvas.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
  canvas.addEventListener('mousedown', () => { if (player) player.boosting = true; });
  window.addEventListener('mouseup', () => { if (player) player.boosting = false; });
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; updatePointer(t.clientX, t.clientY);
    if (player) player.boosting = true;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0]; updatePointer(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', () => { if (player) player.boosting = false; });

  // ---------- AI ----------
  function updateAI(snake, dt) {
    snake.aiTimer -= dt;
    if (snake.aiTimer <= 0 || !snake.aiTargetOrb) {
      snake.aiTimer = rand(1.5, 3);
      let best = null, bestD = Infinity;
      for (const o of orbs) {
        const d = dist2(snake.x, snake.y, o.x, o.y);
        if (d < bestD) { bestD = d; best = o; }
      }
      snake.aiTargetOrb = best;
    }
    if (snake.aiTargetOrb) {
      const dx = snake.aiTargetOrb.x - snake.x;
      const dy = snake.aiTargetOrb.y - snake.y;
      snake.targetAngle = Math.atan2(dy, dx);
    }
    // mild avoidance of world edges (wrap world, so mostly unnecessary, but avoid other heads a bit)
    for (const other of snakes) {
      if (other === snake || !other.alive) continue;
      const d = dist2(snake.x, snake.y, other.x, other.y);
      if (d < 4000) {
        const dx = snake.x - other.x, dy = snake.y - other.y;
        snake.targetAngle = Math.atan2(dy, dx);
        break;
      }
    }
  }

  function normalizeAngleDiff(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function updateSnake(snake, dt) {
    if (!snake.alive) return;

    if (snake.isPlayer) {
      const dx = mouse.x - W / 2;
      const dy = mouse.y - H / 2;
      if (dx * dx + dy * dy > 25) {
        snake.targetAngle = Math.atan2(dy, dx);
      }
    } else {
      updateAI(snake, dt);
    }

    let diff = normalizeAngleDiff(snake.targetAngle - snake.angle);
    const maxTurn = TURN_RATE * dt;
    if (diff > maxTurn) diff = maxTurn;
    if (diff < -maxTurn) diff = -maxTurn;
    snake.angle += diff;

    const speed = snake.speed * (snake.boosting && snake.length > 12 ? BOOST_MULT : 1);
    if (snake.boosting && snake.length > 12) snake.length -= dt * 2.2;

    snake.x = wrapCoord(snake.x + Math.cos(snake.angle) * speed * dt, WORLD.w);
    snake.y = wrapCoord(snake.y + Math.sin(snake.angle) * speed * dt, WORLD.h);

    snake.path.unshift({ x: snake.x, y: snake.y });
    const maxPathLen = Math.floor(snake.length) * 2 + 20;
    if (snake.path.length > maxPathLen) snake.path.length = maxPathLen;
  }

  function eatOrbs(snake) {
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      if (dist2(snake.x, snake.y, o.x, o.y) < (HEAD_RADIUS + o.r) * (HEAD_RADIUS + o.r)) {
        orbs.splice(i, 1);
        snake.length += 0.6;
        orbs.push(makeOrb());
      }
    }
  }

  function killSnake(snake) {
    snake.alive = false;
    const segs = segmentsOf(snake);
    for (let i = 0; i < segs.length; i += 2) {
      orbs.push({ x: segs[i].x + rand(-8, 8), y: segs[i].y + rand(-8, 8), r: rand(3, 5), hue: snake.color.body });
    }
  }

  function checkCollisions() {
    for (const snake of snakes) {
      if (!snake.alive) continue;
      for (const other of snakes) {
        if (!other.alive) continue;
        const segs = segmentsOf(other);
        const startIdx = other === snake ? 10 : 0; // skip near-head self segments
        for (let i = startIdx; i < segs.length; i++) {
          const s = segs[i];
          if (dist2(snake.x, snake.y, s.x, s.y) < HEAD_RADIUS * HEAD_RADIUS * 1.1) {
            killSnake(snake);
            break;
          }
        }
        if (!snake.alive) break;
      }
    }

    if (!player.alive) {
      showGameOver('You crashed!', 'Your snake ran into a trail. Final length: ' + Math.floor(player.length));
    }

    // respawn dead bots after a delay
    for (let i = snakes.length - 1; i >= 0; i--) {
      const s = snakes[i];
      if (!s.alive && !s.isPlayer) {
        s._respawnTimer = (s._respawnTimer || 0) + 1;
        if (s._respawnTimer > 90) {
          const idx = snakes.indexOf(s);
          snakes[idx] = makeSnake(false, idx);
        }
      }
    }
  }

  function computeRank() {
    const alive = snakes.filter(s => s.alive).sort((a, b) => b.length - a.length);
    const idx = alive.indexOf(player);
    return idx === -1 ? '-' : (idx + 1) + ' / ' + alive.length;
  }

  // ---------- Render ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    camera.x += (player.x - camera.x) * 0.15;
    camera.y += (player.y - camera.y) * 0.15;

    ctx.save();
    ctx.translate(W / 2 - camera.x, H / 2 - camera.y);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    const startX = Math.floor((camera.x - W / 2) / gridSize) * gridSize;
    const startY = Math.floor((camera.y - H / 2) / gridSize) * gridSize;
    for (let x = startX; x < camera.x + W / 2; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, camera.y - H / 2); ctx.lineTo(x, camera.y + H / 2); ctx.stroke();
    }
    for (let y = startY; y < camera.y + H / 2; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(camera.x - W / 2, y); ctx.lineTo(camera.x + W / 2, y); ctx.stroke();
    }

    // world border
    ctx.strokeStyle = 'rgba(242,177,52,0.25)';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

    // orbs
    for (const o of orbs) {
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fillStyle = o.hue;
      ctx.shadowColor = o.hue;
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // snakes
    for (const snake of snakes) {
      if (!snake.alive) continue;
      const segs = segmentsOf(snake);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = snake.color.body;
      ctx.shadowColor = snake.color.glow;
      ctx.shadowBlur = snake.isPlayer ? 14 : 8;
      ctx.lineWidth = snake.isPlayer ? 11 : 9;
      ctx.beginPath();
      ctx.moveTo(segs[0].x, segs[0].y);
      for (let i = 1; i < segs.length; i++) ctx.lineTo(segs[i].x, segs[i].y);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // head
      ctx.beginPath();
      ctx.arc(snake.x, snake.y, HEAD_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = snake.color.body;
      ctx.fill();
    }

    ctx.restore();
  }

  // ---------- Loop ----------
  function loop(ts) {
    if (!running) return;
    const dt = Math.min((ts - lastTime) / 1000, 0.05) || 0;
    lastTime = ts;

    for (const s of snakes) updateSnake(s, dt);
    for (const s of snakes) if (s.alive) eatOrbs(s);
    checkCollisions();

    hudLength.textContent = Math.floor(player.length);
    hudRank.textContent = computeRank();

    draw();

    if (running) requestAnimationFrame(loop);
  }

  function showGameOver(title, sub) {
    running = false;
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlay.classList.add('show');
  }

  function startGame() {
    resize();
    resetWorld();
    overlay.classList.remove('show');
    startScreen.style.display = 'none';
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  resize();
})();
</script>
</body>
</html>
