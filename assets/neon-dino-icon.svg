<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Dino icon">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2148"/>
      <stop offset="100%" stop-color="#1c1533"/>
    </linearGradient>
    <linearGradient id="dinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4eefd"/>
      <stop offset="100%" stop-color="#c9c2e0"/>
    </linearGradient>
    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#bgD)"/>

  <g filter="url(#glowD)" fill="url(#dinoGrad)">
    <!-- tail: thick wedge, raised behind the body -->
    <path d="M58,58 Q32,52 16,60 Q13,67 21,71 Q36,78 58,82 Z"/>

    <!-- body -->
    <rect x="52" y="50" width="48" height="48" rx="16"/>

    <!-- head: elongated with a defined jaw, not round -->
    <rect x="64" y="18" width="42" height="34" rx="10"/>
    <rect x="96" y="34" width="22" height="16" rx="6"/>

    <!-- small arm -->
    <rect x="92" y="66" width="16" height="10" rx="5"/>

    <!-- legs -->
    <rect x="58" y="94" width="14" height="28" rx="6"/>
    <rect x="80" y="94" width="14" height="28" rx="6"/>
  </g>

  <circle cx="90" cy="28" r="3.5" fill="#150f22"/>
  <circle cx="122" cy="98" r="5" fill="#6ee7ff" opacity="0.9"/>
</svg>
