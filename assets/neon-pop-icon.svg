<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Pop icon">
  <defs>
    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2148"/>
      <stop offset="100%" stop-color="#1c1533"/>
    </linearGradient>
    <radialGradient id="bubbleGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff2d8"/>
      <stop offset="35%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#c9820f"/>
    </radialGradient>
    <radialGradient id="bubbleCoral" cx="35%" cy="30%" r="70%">
