<svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Slither logo">
  <defs>
    <linearGradient id="coilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#ff6f59"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6f59"/>
      <stop offset="55%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#f2b134"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- coiled snake mark -->
  <g filter="url(#glow)">
    <path d="M22,112 C18,74 44,34 84,36 C124,38 132,78 104,96 C80,111 54,98 58,74 C61,55 82,48 96,60"
          fill="none" stroke="url(#coilGrad)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- head -->
    <circle cx="96" cy="60" r="10" fill="#f2b134"/>
    <circle cx="99" cy="57" r="2.4" fill="#150f22"/>
  </g>

  <!-- orb accents -->
  <circle cx="128" cy="112" r="5" fill="#6ee7ff" filter="url(#glowSoft)"/>
  <circle cx="30" cy="40" r="3.5" fill="#ff6f59" filter="url(#glowSoft)"/>

  <!-- wordmark -->
  <text x="168" y="78" font-family="'Press Start 2P','Courier New',monospace"
        font-size="30" fill="url(#textGrad)" filter="url(#glowSoft)">NEON</text>
  <text x="168" y="112" font-family="'Press Start 2P','Courier New',monospace"
        font-size="30" fill="#f4eefd">SLITHER</text>
</svg>
