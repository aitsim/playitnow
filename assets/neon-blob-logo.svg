<svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Blob logo">
  <defs>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#ff6f59"/>
    </linearGradient>
    <linearGradient id="textGradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6f59"/>
      <stop offset="55%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#f2b134"/>
    </linearGradient>
    <filter id="glowB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoftB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- blob mark -->
  <circle cx="38" cy="106" r="8" fill="#3c2b5c"/>
  <circle cx="96" cy="30" r="5" fill="#3c2b5c"/>
  <g filter="url(#glowB)">
    <circle cx="70" cy="70" r="34" fill="url(#blobGrad)"/>
  </g>
  <circle cx="70" cy="70" r="34" fill="none" stroke="#f4eefd" stroke-width="2" opacity="0.7"/>
  <circle cx="105" cy="100" r="4" fill="#6ee7ff" filter="url(#glowSoftB)"/>

  <!-- wordmark -->
  <text x="128" y="78" font-family="'Press Start 2P','Courier New',monospace"
        font-size="30" fill="url(#textGradB)" filter="url(#glowSoftB)">NEON</text>
  <text x="128" y="112" font-family="'Press Start 2P','Courier New',monospace"
        font-size="30" fill="#f4eefd">BLOB</text>
</svg>
