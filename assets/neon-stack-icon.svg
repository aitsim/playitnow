<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Stack icon">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2148"/>
      <stop offset="100%" stop-color="#1c1533"/>
    </linearGradient>
    <linearGradient id="blockGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff2d8"/>
      <stop offset="100%" stop-color="#f2b134"/>
    </linearGradient>
    <linearGradient id="blockCoral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcabe"/>
      <stop offset="100%" stop-color="#ff6f59"/>
    </linearGradient>
    <linearGradient id="blockCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6f9ff"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#bgS)"/>

  <g filter="url(#glowS)">
    <rect x="30" y="90" width="80" height="20" rx="4" fill="url(#blockGold)"/>
    <rect x="40" y="66" width="60" height="20" rx="4" fill="url(#blockCoral)"/>
    <rect x="48" y="42" width="44" height="20" rx="4" fill="url(#blockCyan)"/>
  </g>

  <circle cx="112" cy="30" r="5" fill="#6ee7ff" opacity="0.9"/>
</svg>
