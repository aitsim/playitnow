<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PlayItNow icon">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2148"/>
      <stop offset="100%" stop-color="#1c1533"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#ff6f59"/>
    </linearGradient>
    <filter id="glowP" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#bgP)"/>

  <g filter="url(#glowP)">
    <path d="M50,38 L102,70 L50,102 Z" fill="url(#playGrad)" stroke-linejoin="round"/>
  </g>

  <circle cx="112" cy="34" r="5" fill="#6ee7ff" opacity="0.9"/>
