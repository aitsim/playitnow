<svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon Stack logo">
  <defs>
    <linearGradient id="blockGoldL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff2d8"/>
      <stop offset="100%" stop-color="#f2b134"/>
    </linearGradient>
    <linearGradient id="blockCoralL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcabe"/>
      <stop offset="100%" stop-color="#ff6f59"/>
    </linearGradient>
    <linearGradient id="blockCyanL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6f9ff"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <linearGradient id="textGradS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6f59"/>
      <stop offset="55%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#f2b134"/>
    </linearGradient>
    <filter id="glowSL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoftS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- stacked blocks mark -->
  <g filter="url(#glowSL)">
    <rect x="14" y="98" width="78" height="20" rx="4" fill="url(#blockGoldL)"/>
    <rect x="24" y="74" width="58" height="20" rx="4" fill="url(#blockCoralL)"/>
    <rect x="32" y="50" width="42" height="20" rx="4" fill="url(#blockCyanL)"/>
  </g>
  <circle cx="98" cy="42" r="4" fill="#6ee7ff" filter="url(#glowSoftS)"/>

  <!-- wordmark -->
  <text x="128" y="78" font-family="'Press Start 2P','Courier New',monospace"
        font-size="30" fill="url(#textGradS)" filter="url(#glowSoftS)">NEON</text>
  <text x="128" y="112" font-family="'Press Start 2P','Courier New',monospace"
        font-size="30" fill="#f4eefd">STACK</text>
</svg>
