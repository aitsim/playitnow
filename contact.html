<body>

  <header class="marquee">
    <div class="marquee__bar">
      <a href="/" class="marquee__title">PlayItNow</a>
      <nav class="marquee__nav">
        <a href="/">Play</a>
        <a href="/contact" aria-current="page">Contact</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>
    </div>
  </header>

  <main>
    <p class="eyebrow">Get in touch</p>
    <h1>Contact us</h1>
    <p class="subhead">
      Found a bug, have a takedown request, or just want to say hi? Reach out below.
    </p>

    <div class="card">
      <p style="margin:0;">
        Email us directly at
        <a href="mailto:contact@playitnow.io">contact@playitnow.io</a>
      </p>
    </div>

    <h2>Or send a message</h2>

    <form action="https://formspree.io/f/xbgraaoa" method="POST">
      <label>
        Name
        <input type="text" name="name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" required />
      </label>
      <label>
        Message
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button type="submit">Send message</button>
    </form>
  </main>

  <footer>
    <div class="footer__bar">
      <span>&copy; <span id="year"></span> PlayItNow</span>
      <div class="footer__links">
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Use</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
