<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — PlayItNow</title>
  <meta name="description" content="Contact PlayItNow with bug reports, takedown requests, or game suggestions — email contact@playitnow.io or use the form below." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/playitnow-icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6530474312289669"
       crossorigin="anonymous"></script>
</head>
<body>

  <header class="marquee">
    <div class="marquee__bar">
      <a href="index.html" class="marquee__title">PlayItNow</a>
      <nav class="marquee__nav">
        <a href="index.html">Play</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </nav>
    </div>
  </header>

  <main>
    <p class="eyebrow">Get in touch</p>
    <h1>Contact us</h1>
    <p class="subhead">
      Found a bug, have a takedown request, or just want to say hi? Reach out below.
    </p>

    <!--
      OPTION A — simplest: a plain mailto link. No setup, works immediately.
      Replace the address, then delete the form block below if you don't want it.
    -->
    <div class="card">
      <p style="margin:0;">
        Email us directly at
        <a href="mailto:contact@playitnow.io">contact@playitnow.io</a>
      </p>
    </div>

    <h2>Or send a message</h2>

    <form action="https://formspree.io/f/xbgraaoa" method="POST">
      <label>
        Name
        <input type="text" name="name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" required />
      </label>
      <label>
        Message
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button type="submit">Send message</button>
    </form>
  </main>

  <footer>
    <div class="footer__bar">
      <span>&copy; <span id="year"></span> PlayItNow</span>
      <div class="footer__links">
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
